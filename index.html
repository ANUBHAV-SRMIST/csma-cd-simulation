<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSMA/CD</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}

  /* 3 rows: spacer / content / credits  -> content sits in the exact centre */
  .page{
    min-height:100vh;
    min-height:100dvh;
    display:grid;
    grid-template-rows:1fr auto 1fr;
    justify-items:center;
    padding:24px 16px;
    text-align:center;
  }

  .top{grid-row:2;display:flex;flex-direction:column;align-items:center;width:100%;}

  .logo{
    width:min(380px,80vw);
    height:auto;
  }

  .gold-line{height:2px;background:#f5b400;margin:12px auto;}
  .gold-line.short{width:80px;}
  .gold-line.long{width:110px;margin-top:18px;}

  .uni{
    font-family:"Times New Roman",serif;
    font-size:clamp(1.15rem,3.6vw,1.55rem);
    font-weight:700;
    color:#fff;
    margin:6px 0 4px;
  }
  .course{
    font-family:"Times New Roman",serif;
    font-size:clamp(.9rem,2.4vw,1.05rem);
    font-weight:700;
    color:#fff;
    margin:0 0 6px;
  }
  .subject{
    font-family:"Times New Roman",serif;
    font-size:clamp(1.05rem,3.8vw,1.65rem);
    font-weight:700;
    color:#fff;
    margin:0;
    max-width:900px;
  }

  .center{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:clamp(24px,5vh,40px);}
  .center h2{margin:0;}

  .credits{
    grid-row:3;
    align-self:end;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:4px 14px;
    padding-top:24px;
    font-family:"Times New Roman",serif;
    font-size:clamp(.78rem,2.2vw,.95rem);
    font-weight:700;
    letter-spacing:.3px;
    color:#93a4c3;
  }

  @media (max-width:600px){
    .credits{flex-direction:column;gap:2px;}
    .credits .sep{display:none;}
  }
</style>
<link rel="stylesheet" href="theme.css">
<script>
  try { sessionStorage.setItem('csmaHome', '1'); } catch (e) {}
</script>
